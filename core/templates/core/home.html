<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Linkora | Connect. Discover. Belong.</title>

    <style>

            padding: 0;

            color: #172033;
            line-height: 1.6;
        }

        nav {

            gap: 20px;
            padding: 20px 8%;
            background: white;
            border-bottom: 1px solid #e8edf4;
        }

        .logo {
            color: #5145cd;
            font-size: 27px;
            font-weight: 800;
            text-decoration: none;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-link {
            color: #374151;
            text-decoration: none;
            font-weight: 600;
        }

        .nav-link:hover {
            color: #5145cd;
        }

        .welcome {
            color: #374151;
            font-weight: 600;
        }

        .hero {
            padding: 95px 8% 85px;
            text-align: center;
            background: linear-gradient(135deg, #eeedff, #f8fafc 65%);
        }

        .badge {
            display: inline-block;
            padding: 7px 15px;
            border-radius: 30px;
            background: #e1deff;
            color: #4338a8;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 22px;
        }

        h1 {
            max-width: 850px;
            margin: 0 auto 20px;
            font-size: clamp(38px, 6vw, 65px);
            line-height: 1.12;
            letter-spacing: -2px;
        }

        h1 span {
            color: #5145cd;
        }

        .hero p {
            max-width: 650px;
            margin: 0 auto 30px;
            color: #5c6678;
            font-size: 18px;
        }

        .button {
            display: inline-block;
            padding: 13px 25px;
            border: none;
            border-radius: 9px;
            background: #5145cd;
            color: white;
            text-decoration: none;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .button:hover {
            background: #4035ad;
        }

        .section {
            padding: 70px 8%;
            text-align: center;
        }

        .section h2 {
            margin-bottom: 12px;
            font-size: 34px;
        }

        .section-intro {
            max-width: 600px;
            margin: 0 auto 38px;
            color: #667085;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
            text-align: left;
        }

        .card {
            padding: 28px;
            background: white;
            border: 1px solid #e7eaf0;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(23, 32, 51, 0.04);
        }

        .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            margin-bottom: 18px;
            border-radius: 12px;
            background: #eeedff;
            font-size: 25px;
        }

        .card h3 {
            margin-bottom: 10px;
            font-size: 21px;
        }

        .card p {
            margin-bottom: 18px;
            color: #667085;
        }

        .card a {
            color: #5145cd;
            font-weight: 700;
            text-decoration: none;
        }

        .card a:hover {
            text-decoration: underline;
        }

        .community {
            margin: 0 8% 70px;
            padding: 45px 25px;
            border-radius: 18px;
            background: #202447;
            color: white;
            text-align: center;
        }

        .community h2 {
            margin-bottom: 12px;
            font-size: 30px;
        }

        .community p {
            margin-bottom: 22px;
            color: #d5d8e9;
        }

        footer {
            padding: 25px 8%;
            background: white;
            border-top: 1px solid #e8edf4;
            color: #667085;
            text-align: center;
        }

        @media (max-width: 760px) {
            nav {
                padding: 18px 6%;
                align-items: flex-start;
            }

            .nav-actions {
                gap: 12px;
            }

            .hero {
                padding: 70px 6%;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .section {
                padding: 55px 6%;
            }

            .community {
                margin-right: 6%;
                margin-left: 6%;
            }
        }

        @media (max-width: 480px) {
            nav {
                flex-direction: column;
                align-items: center;
            }

            .nav-actions {
                justify-content: center;
            }

            .welcome {
                text-align: center;
            }
        }
    </style>
</head>
