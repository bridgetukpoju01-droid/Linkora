<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Linkora</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f4f3ff;
            color: #202447;
        }
        .container {
            max-width: 430px;
            margin: 60px auto;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(32, 36, 71, .08);
        }
        .logo {
            color: #5145cd;
            font-size: 27px;
            font-weight: bold;
            text-decoration: none;
        }
        h1 { margin-top: 28px; }
        p { color: #667085; line-height: 1.6; }
        label { display: block; margin: 18px 0 6px; font-weight: bold; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 7px;
            font-size: 15px;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #5145cd;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #4035ad; }
        a { color: #5145cd; }
        .error { color: #b42318; }
    </style>
</head>
<body>
    <main class="container">
        <a class="logo" href="/">Linkora.</a>

        <h1>Welcome back! 👋</h1>
        <p>Log in to continue your Linkora journey.</p>

        {% if form.errors %}
            <p class="error">Your username or password is incorrect. Please try again.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="{{ form.username.id_for_label }}">Username</label>
            {{ form.username }}

            <label for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit">Log in</button>
        </form>

        <p>New to Linkora? <a href="{% url 'register' %}">Create an account</a></p>
        <p><a href="/">← Back to homepage</a></p>
    </main>
</body>
</html>
