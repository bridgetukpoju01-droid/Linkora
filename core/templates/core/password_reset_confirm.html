<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a New Password | Linkora</title>
</head>
<body style="font-family:Arial,sans-serif;background:#f4f3ff;padding:30px;">
    <main style="max-width:430px;margin:60px auto;background:white;padding:30px;border-radius:16px;">
        <h1>Choose a new password</h1>
        {% if validlink %}
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Reset password</button>
            </form>
        {% else %}
            <p>This password-reset link is invalid or has expired. Please request a new one.</p>
            <a href="{% url 'password_reset' %}">Request another reset link</a>
        {% endif %}
    </main>
</body>
</html>
