<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Linkora</title>
    <style>
        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f4f3ff;
            color: #202447;
        }
        main {
            max-width: 430px;
            margin: 60px auto;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(32,36,71,.08);
        }
        .logo { color: #5145cd; font-size: 27px; font-weight: bold; text-decoration: none; }
        label { display: block; margin: 20px 0 8px; font-weight: bold; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #d0d5dd; border-radius: 7px; }
        button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 8px; background: #5145cd; color: white; font-size: 16px; cursor: pointer; }
        p { line-height: 1.6; color: #667085; }
        a { color: #5145cd; }
    </style>
</head>
<body>
<main>
    <a class="logo" href="/">Linkora.</a>
    <h1>Forgot your password?</h1>
    <p>Enter the email address associated with your account. If an eligible account exists, we'll prepare a password-reset link.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.email.errors }}
        <label for="{{ form.email.id_for_label }}">Email address</label>
        {{ form.email }}
        <button type="submit">Send reset link</button>
    </form>
    <p><a href="{% url 'login' %}">Back to login</a></p>
</main>
</body>
</html>
